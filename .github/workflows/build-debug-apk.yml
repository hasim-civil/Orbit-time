name: Build debug APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a versioned release at this tag (e.g. v.1.1). Leave blank to build a beta only."
        required: false
        default: ""
  push:
    branches:
      - "claude/**"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Missing repository secret GOOGLE_SERVICES_JSON — add it under Settings > Secrets and variables > Actions, with the raw contents of app/google-services.json, then re-run this workflow."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # A versioned release is asked for either by running this workflow with release_tag set,
      # or by pushing a v* tag. Anything else stays exactly as before: a beta prerelease.
      - name: Work out what to publish
        id: release
        run: |
          tag="${{ inputs.release_tag }}"
          if [ -z "$tag" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          fi
          if [ -z "$tag" ]; then
            echo "publish=beta" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          notes=".github/release-notes/${tag}.md"
          if [ ! -f "$notes" ]; then
            notes="$RUNNER_TEMP/notes.md"
            printf 'Orbit Time %s, built from %s.\n' "$tag" "${{ github.sha }}" > "$notes"
          fi
          {
            echo "publish=version"
            echo "tag=$tag"
            echo "notes=$notes"
          } >> "$GITHUB_OUTPUT"

      - name: Rename APK for distribution
        run: |
          mkdir -p app/build/outputs/apk/debug-renamed
          label="${{ steps.release.outputs.tag }}"
          [ -z "$label" ] && label="Beta-${{ github.run_number }}"
          cp app/build/outputs/apk/debug/*.apk "app/build/outputs/apk/debug-renamed/OrbitTime-${label}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbit-time-beta-apk
          path: app/build/outputs/apk/debug-renamed/*.apk
          if-no-files-found: error

      - name: Publish versioned release with APK
        if: steps.release.outputs.publish == 'version'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Orbit Time ${{ steps.release.outputs.tag }}
          body_path: ${{ steps.release.outputs.notes }}
          # Without this the tag is created against the repository's default branch rather than
          # the commit that was actually built — which is how every beta-* tag ended up pointing
          # at 6ec4f1e instead of the branch commit its APK came from.
          target_commitish: ${{ github.sha }}
          prerelease: false
          files: app/build/outputs/apk/debug-renamed/*.apk

      - name: Publish beta release with APK
        if: steps.release.outputs.publish == 'beta'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-${{ github.run_number }}
          name: Orbit Time Beta ${{ github.run_number }}
          body: |
            Automated beta APK build from `${{ github.ref_name }}` @ ${{ github.sha }}.
            Not signed for release — install for testing only (enable "install from unknown sources").
          prerelease: true
          files: app/build/outputs/apk/debug-renamed/*.apk
